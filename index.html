<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Coach AI — Intelligence for Coachs</title>
  <meta name="description" content="Artificial intelligence for sports coaches. Create personalized training sessions for your sport with Coach AI.">
  <meta name="theme-color" content="#050505">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Coach AI">
  <meta property="og:title" content="Coach AI — Intelligence for Coachs">
  <meta property="og:description" content="Artificial intelligence for sports coaches. Create personalized training sessions for your sport with Coach AI.">
  <meta property="og:image" content="assets/og.png">
  <meta property="og:locale" content="en_US">

  <!-- Twitter/X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Coach AI — Intelligence for Coachs">
  <meta name="twitter:description" content="Artificial intelligence for sports coaches. Create personalized training sessions for your sport with Coach AI.">
  <meta name="twitter:image" content="assets/og.png">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Fonte: Archivo (variável, eixo de largura para o display expandido) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- ═══════════ SÍMBOLO OFICIAL COACH AI (reutilizável) ═══════════ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cai-symbol" viewBox="0 0 100 100">
      <g fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
        <path fill-opacity=".12" d="M11.9 28 50 6 50 34 36.1 42Z"/>
        <path fill-opacity=".12" d="M50 6 88.1 28 63.9 42 50 34Z"/>
        <path fill-opacity=".06" d="M88.1 28 88.1 72 63.9 58 63.9 42Z"/>
        <path fill-opacity=".06" d="M11.9 72 11.9 28 36.1 42 36.1 58Z"/>
        <path fill-opacity=".02" d="M88.1 72 50 94 50 66 63.9 58Z"/>
        <path fill-opacity=".02" d="M50 94 11.9 72 36.1 58 50 66Z"/>
      </g>
    </symbol>
  </svg>

  <!-- ═══════════ BACKGROUND ═══════════ -->
  <div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <svg class="bg-watermark"><use href="#cai-symbol"/></svg>
    <svg class="bg-lines" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMin slice">
      <path d="M-80 760 L860 -180" stroke="rgba(0,255,135,.05)"/>
      <path d="M340 1080 L1380 40" stroke="rgba(245,247,245,.035)"/>
      <path d="M720 1120 L1620 220" stroke="rgba(0,255,135,.04)"/>
      <g stroke="rgba(0,255,135,.3)" stroke-width="1.5" stroke-linecap="round">
        <path d="M132 236h12M138 230v12"/>
        <path d="M1290 620h12M1296 614v12"/>
      </g>
      <g stroke="rgba(245,247,245,.22)" stroke-width="1.5" stroke-linecap="round">
        <path d="M1180 180h12M1186 174v12"/>
      </g>
    </svg>
  </div>

  <!-- ═══════════ HEADER ═══════════ -->
  <header class="top">
    <a class="top-brand" href="/" data-i18n-aria="nav.home" aria-label="Coach AI — home">
      <svg class="mark"><use href="#cai-symbol"/></svg>
    </a>

    <div class="top-actions">
      <div class="lang" id="lang-switcher">
        <button class="lang-btn" id="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
          <span id="lang-label">EN</span>
          <svg class="lang-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 4.5 6 8l3.5-3.5"/>
          </svg>
        </button>
        <ul class="lang-menu" role="listbox" aria-labelledby="lang-trigger">
          <li><button type="button" role="option" data-locale="en">English</button></li>
          <li><button type="button" role="option" data-locale="fr">Français</button></li>
          <li><button type="button" role="option" data-locale="es">Español</button></li>
          <li><button type="button" role="option" data-locale="de">Deutsch</button></li>
          <li><button type="button" role="option" data-locale="it">Italiano</button></li>
          <li><button type="button" role="option" data-locale="pt-BR">Português</button></li>
        </ul>
      </div>

      <!-- TODO: substituir pelo handle oficial -->
      <a class="top-insta" href="https://instagram.com/coachai" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="3" y="3" width="18" height="18" rx="5.5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.3" cy="6.7" r=".9" fill="currentColor" stroke="none"/>
        </svg>
        <span>Instagram</span>
      </a>
    </div>
  </header>

  <main>
    <!-- ═══════════ HERO ═══════════ -->
    <section class="hero">
      <div class="hero-logo" style="--d:.05s">
        <svg class="hero-mark"><use href="#cai-symbol"/></svg>
        <span class="hero-word">COACH&nbsp;AI</span>
        <span class="hero-tag">INTELLIGENCE FOR COACHS</span>
      </div>

      <p class="hero-badge" style="--d:.2s"><span class="dot"></span>AI-POWERED SPORTS COACHING</p>

      <h1 class="hero-title" style="--d:.32s" data-i18n="hero.title">
        TRAIN<br>
        SMARTER<span class="g">.</span>
      </h1>

      <p class="hero-sub" style="--d:.44s" data-i18n="hero.sub">
        Create personalized workouts with artificial intelligence and bring more strategy to your training.
      </p>

      <a class="hero-cta" href="#modalidades" style="--d:.56s">
        <span data-i18n="hero.cta">ACCESS COACH AI</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v15M6 13l6 6 6-6"/>
        </svg>
      </a>
    </section>

    <!-- ═══════════ PRODUTOS ═══════════ -->
    <section class="products" id="modalidades">
      <header class="products-head">
        <span class="products-marker"></span>
        <h2 data-i18n="products.title">CHOOSE YOUR SPORT</h2>
        <span class="products-count">05</span>
      </header>

      <div class="cards" id="cards"><!-- renderizado via app.js a partir do array `products` --></div>

      <noscript>
        <ul class="cards-fallback">
          <li><a href="/football">Coach AI Football</a></li>
          <li><a href="/tennis">Coach AI Tennis</a></li>
          <li><a href="/luta">Coach AI Combat</a></li>
          <li><a href="/volleyball">Coach AI Volleyball</a></li>
          <li><a href="/basketball">Coach AI Basketball</a></li>
        </ul>
      </noscript>
    </section>
  </main>

  <!-- ═══════════ FOOTER ═══════════ -->
  <footer class="footer">
    <div class="footer-brand">
      <svg class="mark"><use href="#cai-symbol"/></svg>
      <span>COACH AI</span>
    </div>
    <p class="footer-tag">Intelligence for Coachs</p>
    <p class="footer-copy">© 2026 Coach AI</p>
  </footer>

</body>
</html>
